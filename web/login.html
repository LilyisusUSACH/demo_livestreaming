<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <title>KUSPID HLS - Autenticación 3D</title>
    <!-- Google Fonts, Three.js & Style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div class="app-wrapper">
        <header class="navbar">
            <div class="brand">
                <div class="brand-diamond"></div>
                <div>
                    <div class="brand-title">KUSPID</div>
                    <div class="brand-subtitle">SEÑAL EN VIVO</div>
                </div>
            </div>
            <div style="display: flex; gap: 1.5rem; align-items: center;">
                <a id="nav-login-link" href="#" onclick="toggleAuthMode(event, 'login')" style="font-size: .85rem; display: none; color: var(--text-muted); text-decoration: none;">Iniciar sesión</a>
                <span id="nav-login-active" style="color: var(--text-main); font-weight: 600; font-size: .85rem;">Iniciar sesión</span>
                <a id="nav-register-link" href="#" onclick="toggleAuthMode(event, 'register')" style="font-size: .85rem; color: var(--text-muted); text-decoration: none;">Crear cuenta</a>

                <a href="https://github.com/LilyisusUSACH/demo_livestreaming" target="_blank" rel="noopener noreferrer" class="btn-kuspid-outline" title="Ver repositorio en GitHub" aria-label="Repositorio GitHub" style="text-decoration: none; display: flex; align-items: center; gap: 0.4rem; height: 36px; padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.82rem; box-sizing: border-box;">
                    <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 16 16" height="1.15em" width="1.15em" xmlns="http://www.w3.org/2000/svg" style="color: var(--gold);"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
                    <span>GitHub</span>
                </a>
            </div>
        </header>

        <main class="auth-container">
            <div class="kuspid-card">
                <div id="card-tag" class="card-tag">ACCESO A LA SEÑAL</div>
                <h1 id="card-title" class="card-title">Bienvenido de nuevo</h1>
                <p id="card-desc" class="card-desc">Entra al reproductor y sintoniza en vivo, en 3D.</p>

                <div id="auth-alert" class="alert-message alert-error" role="alert" aria-live="assertive" style="display: none; padding: .85rem; border-radius: 8px; margin-bottom: 1rem; font-size: .9rem; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5;"></div>

                <form onsubmit="handleAuthFormSubmit(event)">
                    <div id="name-group" class="form-group">
                        <label for="name" class="form-label">Nombre completo</label>
                        <input type="text" id="name" class="input-kuspid" placeholder="Tu nombre" autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" id="email" class="input-kuspid" placeholder="tu@email.com" required autocomplete="email">
                    </div>

                    <div class="form-group" style="margin-bottom: 1.8rem;">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" class="input-kuspid" placeholder="••••••••" required autocomplete="current-password">
                    </div>

                    <button type="submit" id="submit-btn" class="btn-gold">Entrar a la señal</button>
                </form>

                <div id="footer-text" style="text-align: center; margin-top: 1.5rem; font-size: .85rem; color: var(--text-muted);">
                    ¿Sin cuenta? <a href="#" onclick="toggleAuthMode(event, 'register')">Crear una</a>
                </div>
            </div>
        </main>

        <!-- Developed by Alejandro Cortés Watermark -->
        <footer style="position: fixed; bottom: 16px; right: 20px; font-size: 0.85rem; color: rgba(255, 255, 255, 0.6); font-family: 'Manrope', sans-serif; pointer-events: none; z-index: 9999; letter-spacing: 0.5px;">Developed by <strong style="color: var(--gold); font-weight: 700;">Alejandro Cortés</strong></footer>
    </div>

    <script src="/static/js/scene3d.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
